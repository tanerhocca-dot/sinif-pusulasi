<style>

.card{margin-bottom:10px}

.cnt{display:flex;gap:10px;font-size:13px;font-weight:700;flex-wrap:wrap}

.qbox{background:var(--bg);border-radius:12px;padding:10px;margin:8px 0}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin:8px 0}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--bd)}

.spin{width:36px;height:36px;border:4px solid var(--bd);border-top-color:var(--acb);border-radius:50%;animation:sp 1s linear infinite;margin:10px auto}

.tgl input{width:auto;margin:0}
.medal{font-size:20px}
#view.home .qkb{flex-direction:row;align-items:center;gap:8px}

.qcat{display:inline-block;margin-left:6px;font-size:11px;padding:1px 8px;border-radius:99px;background:rgba(255,255,255,.65);border:1.5px solid #9CCBF2;vertical-align:1px}
@media(min-width:900px){#view.exw>*{max-width:860px;margin-left:auto;margin-right:auto}}

.lr.xs{grid-template-columns:38px minmax(0,1fr) auto auto}
.lr.xr{grid-template-columns:38px minmax(0,1fr) auto auto 36px}
.nt{text-align:right;font-size:16px}.nt small{display:block;color:var(--mut);font-size:11px}
.av.avm{background:transparent;font-size:22px}

.seg3{display:flex;background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:3px;gap:2px;flex:none}

.rsum2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center;margin-top:10px}

:root{--gl:rgba(255,255,255,.58);--gl2:rgba(255,255,255,.78);--glb:rgba(255,255,255,.85);--gls:0 10px 30px rgba(37,64,107,.10),0 1px 2px rgba(37,64,107,.06);--glh:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.25);--blur:saturate(180%) blur(22px);--bd:rgba(160,190,225,.45)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--gl:rgba(38,57,94,.55);--gl2:rgba(46,68,110,.75);--glb:rgba(255,255,255,.16);--gls:0 10px 30px rgba(0,0,0,.35);--glh:inset 0 1px 0 rgba(255,255,255,.14);--bd:rgba(255,255,255,.12)}}
:root[data-theme="dark"]{--gl:rgba(38,57,94,.55);--gl2:rgba(46,68,110,.75);--glb:rgba(255,255,255,.16);--gls:0 10px 30px rgba(0,0,0,.35);--glh:inset 0 1px 0 rgba(255,255,255,.14);--bd:rgba(255,255,255,.12)}
html{background:#EAF2FB}
body{background:radial-gradient(1200px 700px at -10% -10%,#CFE6FF 0%,transparent 60%),radial-gradient(900px 600px at 110% 0%,#FFF1BF 0%,transparent 55%),radial-gradient(900px 700px at 50% 120%,#DDEBFF 0%,transparent 60%),linear-gradient(180deg,#F3F8FF,#FFFBEC);background-attachment:fixed;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:radial-gradient(1000px 700px at -10% -10%,#22406E 0%,transparent 60%),radial-gradient(900px 600px at 110% 0%,#4A3B12 0%,transparent 55%),linear-gradient(180deg,#14223C,#1B2B4A);background-attachment:fixed}:root:not([data-theme="light"]) html{background:#14223C}}
:root[data-theme="dark"] body{background:radial-gradient(1000px 700px at -10% -10%,#22406E 0%,transparent 60%),radial-gradient(900px 600px at 110% 0%,#4A3B12 0%,transparent 55%),linear-gradient(180deg,#14223C,#1B2B4A);background-attachment:fixed}
.hd{background:transparent!important;padding:14px 16px 6px!important}
.hd img{width:58px!important;height:58px!important;border-radius:50%;filter:drop-shadow(0 6px 12px rgba(37,64,107,.25))!important}

main{margin-top:0!important}
.ishome .hd{padding:10px 16px 4px!important}.ishome .hd img{width:50px!important;height:50px!important}
/* cam yüzeyler */
.card,.sum div,.mb,.st div,.qbox,.mc,.cdi,.qkb,.rsum2,.imp{background:var(--gl)!important;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glb)!important;box-shadow:var(--gls),var(--glh)!important}
.card{border-radius:22px!important}
.st div,.cdi,.qkb,.mc{border-radius:16px!important;box-shadow:var(--glh)!important;background:var(--gl2)!important}
.mb{border-radius:26px!important;background:var(--gl2)!important}
.md{background:rgba(20,40,80,.28)!important;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
/* gezinme: tek cam şerit */
nav{background:var(--gl);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glb);box-shadow:var(--gls),var(--glh);border-radius:20px;padding:5px;gap:4px!important;position:sticky;top:calc(6px + env(safe-area-inset-top,0px));z-index:15}

nav button.on{background:linear-gradient(180deg,#FFF6CF,#FFE08A)!important;color:#25406B!important;box-shadow:0 4px 12px rgba(233,176,74,.35),inset 0 1px 0 rgba(255,255,255,.9)}
nav button:active{transform:scale(.95)}
/* düğmeler */
.btn{border-radius:14px!important;border:1px solid var(--glb)!important;box-shadow:0 2px 8px rgba(37,64,107,.08),var(--glh);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:active{transform:scale(.96)}
.btn.y{background:linear-gradient(180deg,#FFF3C4,#FFDB73)!important;color:#25406B!important}
.btn:not(.y):not(.g):not(.wa):not(.del){background:linear-gradient(180deg,#E3F0FF,#BBD8F8)!important;color:#1E3A66!important}
.btn.g{background:var(--gl2)!important;color:var(--tx)!important}
.btn.wa{background:linear-gradient(180deg,#36C46F,#1FA855)!important;color:#fff!important;border-color:rgba(255,255,255,.35)!important}
.btn.del{background:var(--gl2)!important}
.chip,.tag{background:var(--gl2)!important;border:1px solid var(--glb)!important;box-shadow:var(--glh)}
.chip.on{background:linear-gradient(180deg,#FFF3C4,#FFDB73)!important;color:#25406B!important}
.seg2,.seg3{background:var(--gl)!important;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glb)!important;box-shadow:var(--glh);border-radius:16px!important}
.seg2 button.on,.seg3 button.on{background:var(--card)!important;color:var(--tx)!important;box-shadow:0 3px 10px rgba(37,64,107,.12),inset 0 1px 0 rgba(255,255,255,.9)}
input,select,textarea{background:var(--gl2)!important;border:1px solid var(--bd)!important;border-radius:14px!important;box-shadow:inset 0 1px 2px rgba(37,64,107,.06)}
.seg button{border-radius:12px!important;background:var(--gl2)!important;border:1px solid var(--bd)!important;transition:transform .12s}

.av{background:linear-gradient(180deg,#FFF3C4,#FFDB73)!important;box-shadow:0 2px 6px rgba(233,176,74,.3),inset 0 1px 0 rgba(255,255,255,.9)}
.fab,.dice{background:radial-gradient(120% 120% at 30% 20%,rgba(255,255,255,.95),rgba(255,236,170,.85) 45%,rgba(255,214,102,.9))!important;border:1px solid rgba(255,255,255,.9)!important;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 12px 28px rgba(37,64,107,.25),inset 0 2px 0 rgba(255,255,255,.9),inset 0 -6px 12px rgba(233,176,74,.25)!important}
.dice{background:radial-gradient(120% 120% at 30% 20%,rgba(255,255,255,.95),rgba(220,236,255,.85) 50%,rgba(170,205,246,.9))!important}
.hq{background:linear-gradient(135deg,rgba(255,246,206,.85),rgba(255,221,120,.75))!important}
.cal .calt{background:linear-gradient(135deg,#E06A57,#B8402F)!important}
.ts{background:rgba(30,50,90,.82)!important;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid rgba(255,255,255,.25)!important;border-radius:16px!important;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.lst .lr,.pl .pr{transition:background .2s}
.lst .lr:active,.pl .pr:active{background:rgba(255,255,255,.35)}
.bar{background:rgba(160,190,225,.25)!important}

function trAvg(n){var k=lgsKey(n),x=k&&LGS26[k];return x?x.q*x.p:null}
function lgsInfo(e,sid){if(!isLGS(e))return null;var sc=estScore(e,sid);if(!sc)return null;return {sc:sc,pct:estPct(sc.v),fit:schoolFit(sc.v),w:wNet(e,sid)}}

/* ---- trend (son 3 deneme) ---- */
function trendOf(vals,thr){var v=vals.filter(function(x){return x!=null}).slice(-3);if(v.length<2)return null;var n=v.length,mx=(n-1)/2,my=v.reduce(function(a,b){return a+b},0)/n,num=0,den=0;v.forEach(function(y,i){num+=(i-mx)*(y-my);den+=(i-mx)*(i-mx)});var sl=num/den;return {sl:sl,dir:sl>=thr?'up':sl<=-thr?'down':'flat',n:n,ch:v[n-1]-v[0]}}
function subTrend(cid,sid,sub,upto){var ex=stuExams(cid,sid).filter(function(z){return !upto||z.date<=upto.date});var q=(ex.length?(ex[ex.length-1].subs.find(function(s){return s.n===sub})||{}).q:0)||10;return trendOf(ex.map(function(z){return subNet(z,sid,sub)}),Math.max(.4,q*.03))}
function totTrend(cid,sid,upto){var ex=stuExams(cid,sid).filter(function(z){return !upto||z.date<=upto.date});return trendOf(ex.map(function(z){return totNet(z,sid)}),1.5)}
function trBadge(t){if(!t)return '<span class="pill p">Trend için 2+ deneme</span>';return t.dir==='up'?'<span class="pill y">📈 Yükselişte</span>':t.dir==='down'?'<span class="pill n">📉 Düşüşte</span>':'<span class="pill p">➡️ Yatay</span>'}
function trWord(t){return !t?'':t.dir==='up'?'yükselişte':t.dir==='down'?'düşüşte':'yatay seyrediyor'}
function svgMini(pts,q){var W=300,H=118,P={l:26,r:22,t:26,b:22},max=q||Math.max(5,Math.ceil(Math.max.apply(null,pts.map(function(p){return p.v||0}))*1.2));
  var X=function(i){return pts.length<2?W/2:P.l+i*(W-P.l-P.r)/(pts.length-1)},Y=function(v){return H-P.b-(Math.max(0,Math.min(max,v))/max)*(H-P.t-P.b)};
  var g=[0,max/2,max].map(function(v){return '<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--bd)"/><text x="'+(P.l-5)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="10" fill="var(--mut)">'+fmt(v)+'</text>'}).join('');
  var vv=pts.filter(function(p){return p.v!=null});var path=pts.map(function(p,i){return p.v==null?'':(i&&pts[i-1].v!=null?'L':'M')+X(i)+' '+Y(p.v)}).join(' ');
  var hl=pts.length-3;
  var mk=pts.map(function(p,i){if(p.v==null)return '';var last=i===pts.length-1;return '<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="'+(last?5:4)+'" fill="'+BLUE+'" stroke="var(--card)" stroke-width="2" opacity="'+(i>=hl?1:.45)+'"/><circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="13" fill="transparent"><title>'+esc(p.l)+': '+fmt(p.v)+' net</title></circle>'+(last?'<text x="'+X(i)+'" y="'+(Y(p.v)-10)+'" text-anchor="end" font-size="12" font-weight="800" fill="var(--tx)">'+fmt(p.v)+'</text>':'')}).join('');
  var band=pts.length>=3?'<rect x="'+(X(Math.max(0,pts.length-3))-8)+'" y="'+P.t/2+'" width="'+(X(pts.length-1)-X(Math.max(0,pts.length-3))+16)+'" height="'+(H-P.b-P.t/2)+'" rx="6" fill="var(--bg)" opacity=".8"/>':'';
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img">'+band+g+'<path d="'+path+'" fill="none" stroke="'+BLUE+'" stroke-width="2"/>'+mk+'</svg>'}

function autoComment(e,sid){

  if(d!=null)out.push(Math.abs(d)<.5?fn+' bir önceki denemeye göre netini korudu ('+fmt(totNet(e,sid))+' net).':d>0?fn+' bir önceki denemeye göre toplam netini '+fmt(d)+' artırarak '+fmt(totNet(e,sid))+' nete çıkardı.':fn+' bu denemede bir öncekine göre '+fmt(-d)+' net geriledi ('+fmt(totNet(e,sid))+' net).');
  else out.push(fn+' bu denemede '+fmt(totNet(e,sid))+' net yaptı.');
  if(rk&&rankShare())out.push('Sınıf içinde '+rk.n+' öğrenci arasında '+rk.r+'. sırada.');
  var diff=e.subs.map(function(s){var v=subNet(e,sid,s.n),a=avgSub(e,s.n);return v==null||a==null?null:{n:s.n,v:v,df:v-a}}).filter(Boolean).sort(function(a,b){return b.df-a.df});
  if(diff.length>1){if(diff[0].df>0.5)out.push('En güçlü olduğu ders '+diff[0].n+' (sınıf ortalamasının '+fmt(diff[0].df)+' net üzerinde).');var w=diff[diff.length-1];if(w.df<-0.5)out.push('Desteklenmesi gereken ders '+w.n+' (sınıf ortalamasının '+fmt(-w.df)+' net altında).')}
  if(p){var g=e.subs.map(function(s){var a=subNet(e,sid,s.n),b=subNet(p,sid,s.n);return a==null||b==null?null:{n:s.n,g:a-b}}).filter(Boolean).sort(function(a,b){return b.g-a.g});if(g.length&&g[0].g>=1)out.push('En belirgin gelişim '+g[0].n+' dersinde (+'+fmt(g[0].g)+' net).')}
  var tt=totTrend(e.cid,sid,e);if(tt&&tt.n>=3)out.push('Son üç denemede toplam neti '+trWord(tt)+(tt.dir!=='flat'?' ('+sgn(tt.ch)+' net)':'')+'.');
  var su=[],sd=[];e.subs.forEach(function(s){var t=subTrend(e.cid,sid,s.n,e);if(t&&t.n>=3){if(t.dir==='up')su.push(s.n);else if(t.dir==='down')sd.push(s.n)}});
  if(su.length)out.push('Yükselişte olan dersler: '+su.join(', ')+'.');if(sd.length)out.push('Düşüşte olan dersler: '+sd.join(', ')+'; bu derslere ek tekrar önerilir.');
  var li=lgsInfo(e,sid);if(li){out.push((li.sc.est?'Netlerine göre tahmini LGS puanı ':'LGS puanı ')+fmt(li.sc.v)+'; 2026 verilerine göre bu puan yaklaşık '+fmtPct(li.pct)+'’lik dilime karşılık geliyor.');
    var tr=e.subs.map(function(s){var k=lgsKey(s.n),a=trAvg(s.n),q=((e.r[sid]||{}).s||{})[s.n]||{},v=q.d!==''&&q.d!=null?+q.d:subNet(e,sid,s.n);return a==null||v==null?null:{n:s.n,df:v-a,a:a}}).filter(Boolean);
    var above=tr.filter(function(x){return x.df>=1}).map(function(x){return x.n}),below=tr.filter(function(x){return x.df<=-1}).sort(function(a,b){return a.df-b.df});
    if(above.length)out.push('2026 LGS Türkiye ortalamasının üzerinde olduğu dersler: '+above.join(', ')+'.');
    if(below.length)out.push(below[0].n+' dersinde Türkiye ortalamasının ('+fmt(below[0].a)+' doğru) altında; öncelikli çalışılmalı.');
    if(li.fit.up.length)out.push('Bir sonraki hedef: '+li.fit.up[0].n+' (2026 taban '+fmt(li.fit.up[0].t)+', '+fmt(li.fit.up[0].t-li.sc.v)+' puan uzakta).');}
  var ex=stuExams(e.cid,sid),ix=ex.indexOf(e);if(!(tt&&tt.n>=3)&&ix>=2&&totNet(ex[ix],sid)>totNet(ex[ix-1],sid)&&totNet(ex[ix-1],sid)>totNet(ex[ix-2],sid))out.push('Son üç denemedir istikrarlı bir yükseliş içinde 👏');
  return out.join(' ');
}
