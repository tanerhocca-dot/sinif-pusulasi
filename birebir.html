<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Birebir · Koçluk</title>
<meta name="theme-color" content="#161616">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Birebir">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="birebir.webmanifest">
<link rel="icon" type="image/png" href="icons/birebir-128.png">
<link rel="apple-touch-icon" href="icons/birebir-apple.png">
<script src="config.js"></script>
<style>
:root{--bg:#F6F2E8;--card:#fff;--tx:#1F2430;--mut:#6B7180;--bd:#E7E1D2;--g1:#C9A227;--g2:#F3D77A;--k:#161616;--ok:#23845F;--warn:#B9741F;--bad:#C4503F;--okb:#DDF3E9;--warnb:#FCEBCF;--badb:#F9DED9;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--card:#1E1E1E;--tx:#F3EEDF;--mut:#B3AD9C;--bd:#34302A;--ok:#7FDDB5;--warn:#F2C26B;--bad:#FF9C8F;--okb:#1F3A31;--warnb:#3E3220;--badb:#432623;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(150px + env(safe-area-inset-bottom,0px))}
.hd{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:22px;background:linear-gradient(135deg,#1B1B1B,#2B2620 60%,#3A3020);color:#F7E7B0;box-shadow:0 8px 24px rgba(20,16,8,.25)}
.hd img{width:48px;height:48px;border-radius:50%;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));flex:none}
.hd .t{flex:1;min-width:0}.hd .t b{font-size:22px;font-weight:900;display:flex;align-items:center;gap:7px}.hd .t small{display:block;color:#D9C68D;font-weight:700;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.beta{font-size:10px;font-weight:900;letter-spacing:.12em;background:linear-gradient(180deg,#F8E08E,#C9A227);color:#161616;border-radius:99px;padding:3px 8px}
.hb{width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(247,231,176,.4);background:rgba(255,255,255,.06);color:#F7E7B0;font-size:17px;cursor:pointer;flex:none}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:20px;padding:14px;margin-top:12px}
h2{font-size:17px;margin:0 0 8px;font-weight:900;display:flex;align-items:center;gap:6px}
.mut{color:var(--mut);font-weight:700;font-size:13px}
.msg{background:linear-gradient(135deg,#FFF6D6,#F8E7A6);color:#3A2E0A;border:1.5px solid #E4C35A;border-radius:18px;padding:12px 14px;margin-top:12px;font-weight:800}
.msg small{display:block;font-size:11px;letter-spacing:.08em;font-weight:900;color:#8A6D12}
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}.kp>div{background:var(--card);border:1.5px solid var(--bd);border-radius:16px;padding:10px 6px;text-align:center;min-width:0}
.kp b{display:block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}.kp small{font-size:11.5px;font-weight:800;color:var(--mut)}
.lo{color:var(--bad)}.mi{color:var(--warn)}.hi{color:var(--ok)}
.bar{height:10px;border-radius:99px;background:rgba(160,150,120,.22);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#C9A227,#E9C454)}
.tk{display:flex;align-items:stretch;border-left:5px solid var(--dc);background:rgba(160,150,120,.1);border-radius:14px;margin-top:8px;overflow:hidden}
.tk .m{flex:1;min-width:0;padding:10px 8px 10px 12px}.tk .m b{display:block;font-size:15px}.tk .m small{display:block;font-size:12.5px;color:var(--mut);font-weight:700}.tk .m .nt{font-style:italic}.tk .m .rs{color:var(--tx);font-weight:900}
.tk.s-y .rs{color:var(--ok)}.tk.s-n .rs{color:var(--bad)}.tk.s-e .rs{color:var(--warn)}
.tk button{width:86px;flex:none;border:0;background:linear-gradient(180deg,#F8E08E,#C9A227);color:#161616;font-weight:900;font-size:13px;cursor:pointer}
.tk.s-y button{background:var(--okb);color:var(--ok)}.tk.s-n button{background:var(--badb);color:var(--bad)}.tk.s-e button{background:var(--warnb);color:var(--warn)}
.pend{display:inline-block;font-size:11px;font-weight:900;border-radius:99px;padding:1px 7px;margin-left:4px;background:var(--warnb);color:var(--warn)}
.day h3{font-size:14px;margin:14px 0 2px;display:flex;gap:8px;align-items:baseline}.day h3 small{color:var(--mut);font-weight:700}.day.now h3{color:#A8860F}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px}.chip{flex:none;border:1.5px solid var(--bd);background:var(--card);border-radius:99px;padding:7px 13px;font-weight:800;font-size:13.5px;cursor:pointer}.chip.on{background:linear-gradient(180deg,#F8E08E,#C9A227);color:#161616;border-color:#161616}
.btn{border:2px solid var(--k);background:linear-gradient(180deg,#F8E08E,#C9A227);color:#161616;font-weight:900;border-radius:14px;padding:11px 14px;cursor:pointer;font-size:15px}.btn.g{background:var(--card);color:var(--tx);border-color:var(--bd)}.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(22,22,22,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
nav button{flex:1;max-width:150px;border:0;background:none;color:#B9AF92;font-weight:800;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;cursor:pointer}nav button span{font-size:20px}nav button.on{background:rgba(201,162,39,.18);color:#F3D77A}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:21;border:2px solid #161616;background:linear-gradient(180deg,#F8E08E,#C9A227);color:#161616;font-weight:900;border-radius:99px;padding:12px 16px;box-shadow:0 8px 20px rgba(0,0,0,.25);cursor:pointer;font-size:15px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,10,10,.55);display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media(min-width:620px){.ov{align-items:center}.sh{border-radius:24px}}
.sh h3{margin:0 0 4px;font-size:19px}label{display:block;font-size:12.5px;font-weight:900;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;border:1.5px solid var(--bd);border-radius:12px;padding:11px 12px;background:var(--card);font-size:16px;font-weight:700;outline:none}input:focus,select:focus,textarea:focus{border-color:#C9A227;box-shadow:0 0 0 3px rgba(201,162,39,.25)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stp{display:flex;align-items:center;border:1.5px solid var(--bd);border-radius:12px;overflow:hidden}.stp button{width:38px;height:44px;border:0;background:rgba(160,150,120,.15);font-size:20px;font-weight:900;cursor:pointer;flex:none}.stp input{border:0;border-radius:0;text-align:center;padding:10px 0;min-width:0}.stp input:focus{box-shadow:none}
.sum{font-weight:800;margin:10px 0 0;font-size:14px}
.acts{display:flex;gap:8px;margin-top:16px}.acts .btn{flex:1}
.dg{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px 50px;gap:6px 8px;align-items:center;margin-top:8px}.dg>b{font-size:11.5px;color:var(--mut);text-align:center}.dg .l{font-weight:800;border-left:4px solid var(--dc);padding-left:8px;font-size:14px}.dg .l small{color:var(--mut)}.dg input{text-align:center;padding:9px 2px}.dg output{text-align:center;font-weight:900}
.hb2{display:grid;grid-template-columns:minmax(110px,1.2fr) 2fr 48px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--bd)}.hb2:first-of-type{border-top:0}
.bbhb{display:grid;grid-template-columns:minmax(110px,1.2fr) 2fr 48px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--bd)}.bbhl{min-width:0}.bbhl b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis}.bbhl small{display:block;font-size:11.5px;color:var(--mut);font-weight:700}
.bbht{height:12px;border-radius:99px;background:rgba(160,150,120,.22);overflow:hidden}.bbht i{display:block;height:100%;border-radius:99px}.bbhv{text-align:right;font-variant-numeric:tabular-nums}.bbhv.lo{color:var(--bad)}.bbhv.mi{color:var(--warn)}.bbhv.hi{color:var(--ok)}
.bbsvg{display:block}.bbsvg .bbgl{stroke:rgba(160,150,120,.3)}.bbsvg .bbtx{font-size:11px;fill:var(--mut);font-family:inherit;font-weight:700}.bbsvg .bbtx.b{fill:var(--tx);font-weight:900}
.kr{display:flex;align-items:center;gap:6px}.kr .bbhb{flex:1;min-width:0}.yt{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#E0574F;color:#fff;text-decoration:none;font-size:12px;font-weight:900}
.lg2{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;font-weight:800;color:var(--mut)}.lg2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.dl{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd);cursor:pointer}.dl:first-of-type{border-top:0}.dl .m{flex:1;min-width:0}.dl b{display:block}.dl small{color:var(--mut);font-weight:700;font-size:12.5px}.dl .n{font-size:20px;font-weight:900;text-align:right}.dl .n small{display:block;font-size:11px}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--mut);margin-top:10px;justify-content:center;text-align:center}
.empty{text-align:center;color:var(--mut);font-weight:700;padding:14px 6px}
.ts{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#161616;color:#F7E7B0;font-weight:800;padding:10px 16px;border-radius:14px;z-index:60;max-width:90vw;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.3)}
nav button{position:relative}.nb{position:absolute;top:2px;left:50%;margin-left:6px;min-width:18px;height:18px;border-radius:99px;background:#E0453A;color:#fff;font-style:normal;font-size:11px;font-weight:900;display:grid;place-items:center;padding:0 5px;border:2px solid #161616}
.chc{padding:0;overflow:hidden}.chat{height:calc(100vh - 360px);min-height:260px;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.cd{text-align:center;font-size:11.5px;font-weight:900;color:var(--mut);margin:10px 0 6px}.msg2{display:flex;margin:4px 0}.msg2.me{justify-content:flex-end}
.mb{max-width:80%;padding:8px 12px 6px;border-radius:18px;font-size:15px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}.msg2.ot .mb{background:var(--card);border:1.5px solid var(--bd);border-bottom-left-radius:6px}.msg2.me .mb{background:linear-gradient(180deg,#F8E08E,#E2BE48);color:#161616;border-bottom-right-radius:6px}
.mb small{display:block;text-align:right;font-size:10.5px;font-weight:800;opacity:.7;margin-top:2px}.seen{color:#1E7BD6}.seen2{text-align:right;font-size:11px;font-weight:800;color:var(--mut);margin:2px 4px}
.comp{display:flex;gap:8px;align-items:flex-end;padding:8px 10px 10px;border-top:1px solid var(--bd)}.comp textarea{flex:1;resize:none;min-height:46px;max-height:140px}.comp .btn{width:54px;height:48px;padding:0;font-size:20px;flex:none}
.ntp{display:flex;gap:8px;align-items:center;justify-content:space-between;background:rgba(201,162,39,.14);border:1.5px solid rgba(201,162,39,.45);border-radius:14px;padding:8px 10px;margin-top:12px;font-weight:800;font-size:13px}
#nt{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:10px;width:min(440px,calc(100vw - 20px));text-align:left;background:#1B1B1B;color:#F7E7B0;border:1.5px solid #C9A227;border-radius:18px;padding:10px 12px;box-shadow:0 14px 34px rgba(0,0,0,.35);cursor:pointer}
#nt img{width:38px;height:38px;border-radius:50%}#nt span{flex:1;min-width:0}#nt b{display:block}#nt small{display:block;color:#E8DDB8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#nt i{font-style:normal;font-weight:900;color:#F3D77A}
.ico{display:inline-flex;width:1.15em;height:1.15em;vertical-align:-.2em;margin-right:.3em;flex:none}.ico svg{width:100%;height:100%}nav .ico{width:22px;height:22px;margin:0}.hb .ico{margin:0;width:19px;height:19px}.tk .m b .ico{color:var(--dc)}
/* giriş */
#lg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(700px 500px at 50% -10%,#3A3020,transparent 70%),#141414}
#lg .bx{background:var(--card);border-radius:28px;padding:26px 22px;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}
#lg img{width:120px;height:120px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.35))}#lg h1{margin:8px 0 2px;font-size:30px;font-weight:900;display:flex;justify-content:center;align-items:center;gap:8px}
#lg p{margin:0 0 16px}#lg input{margin-bottom:10px}#lg .er{min-height:20px;color:var(--bad);font-weight:800;font-size:14px;margin:2px 0 8px}#lg .btn{width:100%}
@media(max-width:560px){.kp{grid-template-columns:repeat(2,minmax(0,1fr))}.bbhb{grid-template-columns:minmax(0,1fr) 44px;gap:4px 8px}.bbht{grid-column:1/-1;grid-row:2}}
</style>
</head>
