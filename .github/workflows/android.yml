name: Android test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'index.html'
      - 'cloud.js'
      - 'push.js'
      - 'config.js'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bağımlılıklar
        working-directory: app
        run: npm ci
      - name: Web dosyalarını uygulamaya kopyala
        working-directory: app
        run: npm run sync
      - name: APK derle
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../SinifPusulasi-test.apk
      - name: Test sürümüne yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view test-apk >/dev/null 2>&1 || gh release create test-apk --prerelease --title "Sınıf Pusulası · Android test" --notes "Telefon ve tablete kurulacak deneme sürümü. Her güncellemede bu dosya yenilenir."
          gh release upload test-apk SinifPusulasi-test.apk --clobber
