<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}

.bbht{height:12px;border-radius:99px;background:rgba(160,150,120,.22);overflow:hidden}.bbht i{display:block;height:100%;border-radius:99px}.bbhv{text-align:right;font-variant-numeric:tabular-nums}.bbhv.lo{color:var(--bad)}.bbhv.mi{color:var(--warn)}.bbhv.hi{color:var(--ok)}
.bbsvg{display:block}.bbsvg .bbgl{stroke:rgba(160,150,120,.3)}.bbsvg .bbtx{font-size:11px;fill:var(--mut);font-family:inherit;font-weight:700}.bbsvg .bbtx.b{fill:var(--tx);font-weight:900}
.kr{display:flex;align-items:center;gap:6px}.kr .bbhb{flex:1;min-width:0}.yt{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#E0574F;color:#fff;text-decoration:none;font-size:12px;font-weight:900}
.lg2{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;font-weight:800;color:var(--mut)}.lg2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.dl{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd);cursor:pointer}.dl:first-of-type{border-top:0}.dl .m{flex:1;min-width:0}.dl b{display:block}.dl small{color:var(--mut);font-weight:700;font-size:12.5px}.dl .n{font-size:20px;font-weight:900;text-align:right}.dl .n small{display:block;font-size:11px}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--mut);margin-top:10px;justify-content:center;text-align:center}
.empty{text-align:center;color:var(--mut);font-weight:700;padding:14px 6px}
.ts{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#161616;color:#F7E7B0;font-weight:800;padding:10px 16px;border-radius:14px;z-index:60;max-width:90vw;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.3)}
/* giriş */
#lg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(700px 500px at 50% -10%,#3A3020,transparent 70%),#141414}
#lg .bx{background:var(--card);border-radius:28px;padding:26px 22px;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}
#lg img{width:120px;height:120px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.35))}#lg h1{margin:8px 0 2px;font-size:30px;font-weight:900;display:flex;justify-content:center;align-items:center;gap:8px}
#lg p{margin:0 0 16px}#lg input{margin-bottom:10px}#lg .er{min-height:20px;color:var(--bad);font-weight:800;font-size:14px;margin:2px 0 8px}#lg .btn{width:100%}
@media(max-width:560px){.kp{grid-template-columns:repeat(2,minmax(0,1fr))}.bbhb{grid-template-columns:minmax(0,1fr) 44px;gap:4px 8px}.bbht{grid-column:1/-1;grid-row:2}}

<script>
/* Birebir · LGS ders/konu verisi (2027 LGS konu listesi; kaynak: basarisiralamalari.com, MEB soru dağılımı 20-20-20-10-10-10)
   Puan katsayıları: 2023 MEB LGS ortalama net katsayıları (taban 194,752) — yalnızca TAHMİNİ puan içindir. */
var BBD={base:194.752,
 d:[
  {k:'tr',n:'Türkçe',s:'Türkçe',q:20,c:4.348,col:'#E0574F',konu:['Sözcükte Anlam','Cümlede Anlam','Parçada Anlam (Paragraf)','Sözel Mantık ve Görsel Okuma','Fiilimsiler','Cümlenin Ögeleri','Cümle Türleri','Fiillerde Çatı','Yazım Kuralları','Noktalama İşaretleri','Metin Türleri','Söz Sanatları','Anlatım Bozuklukları']},
  {k:'mat',n:'Matematik',s:'Mat.',q:20,c:4.253,col:'#3B7DDD',konu:['Çarpanlar ve Katlar','Üslü İfadeler','Kareköklü İfadeler','Veri Analizi','Basit Olayların Olma Olasılığı','Cebirsel İfadeler ve Özdeşlikler','Doğrusal Denklemler','Eşitsizlikler','Üçgenler','Eşlik ve Benzerlik','Dönüşüm Geometrisi','Geometrik Cisimler']},
  {k:'fen',n:'Fen Bilimleri',s:'Fen',q:20,c:4.1236,col:'#2E9E6A',konu:['Mevsimler ve İklim','DNA ve Genetik Kod','Basınç','Madde ve Endüstri','Basit Makineler','Enerji Dönüşümleri ve Çevre Bilimi','Elektrik Yükleri ve Elektrik Enerjisi']},
  {k:'ink',n:'İnkılap Tarihi',s:'İnkılap',q:10,c:1.6662,col:'#C98A1B',konu:['Bir Kahraman Doğuyor','Millî Uyanış','Ya İstiklal Ya Ölüm','Atatürkçülük ve Çağdaşlaşan Türkiye','Demokratikleşme Çabaları','Atatürk Dönemi Dış Politika','Atatürk’ün Ölümü ve Sonrası']},
  {k:'din',n:'Din Kültürü',s:'Din',q:10,c:1.8991,col:'#8A5CC9',konu:['Kader İnancı','Zekât ve Sadaka','Din ve Hayat','Hz. Muhammed’in Örnekliği','Kur’an-ı Kerim ve Özellikleri']},
  {k:'ing',n:'İngilizce',s:'İng.',q:10,c:1.5075,col:'#D4569B',konu:['Friendship','Teen Life','In The Kitchen','On The Phone','The Internet','Adventures','Tourism','Chores','Science','Natural Forces']}
 ],
 tp:[['soru','Soru çözümü','✏️'],['konu','Konu çalışma','📖'],['tekrar','Tekrar','🔁'],['video','Video ders','▶️'],['deneme','Branş denemesi','⏱️'],['kitap','Kitap okuma','📚'],['diger','Diğer','⭐']],
 gun:['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'],
 gunL:['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar']
};
function bbDers(k){for(var i=0;i<BBD.d.length;i++)if(BBD.d[i].k===k)return BBD.d[i];return {k:k,n:k||'Diğer',s:k||'Diğer',q:0,c:0,col:'#8A97AD',konu:[]}}
function bbTp(k){for(var i=0;i<BBD.tp.length;i++)if(BBD.tp[i][0]===k)return BBD.tp[i];return BBD.tp[0]}
function bbIso(x){return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function bbAdd(d,n){var x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return bbIso(x)}
function bbMon(d){var x=new Date(d+'T12:00');x.setDate(x.getDate()-((x.getDay()+6)%7));return bbIso(x)}
function bbDow(d){return (new Date(d+'T12:00').getDay()+6)%7}
function bbNet(D,Y){return Math.round(((+D||0)-(+Y||0)/3)*100)/100}
function bbDnNet(dn,k){var r=(dn.r||{})[k];if(!r||(r[0]===''&&r[1]===''))return null;return bbNet(r[0],r[1])}
function bbDnTot(dn){var t=0,any=false;BBD.d.forEach(function(d){var n=bbDnNet(dn,d.k);if(n!=null){t+=n;any=true}});return any?Math.round(t*100)/100:null}
function bbPuan(dn){var p=BBD.base,any=false;BBD.d.forEach(function(d){var n=bbDnNet(dn,d.k);if(n!=null){any=true;p+=Math.max(0,n)*d.c}});return any?Math.min(500,Math.round(p*100)/100):null}
function bbPct(D,Y,B){var t=(+D||0)+(+Y||0)+(+B||0);return t?Math.round((+D||0)/t*100):null}
function bbYt(ds,kn){return 'https://www.youtube.com/results?search_query='+encodeURIComponent('LGS '+(kn||'')+' '+(bbDers(ds).n)+' konu anlatımı')}
/* Kayıtlardan ders ve konu toplamları */
function bbAgg(logs){var A={d:{},k:{},q:0,D:0,Y:0,B:0,dk:0,n:0};logs.forEach(function(l){if(l.x)return;var D=+l.D||0,Y=+l.Y||0,B=+l.B||0,q=D+Y+B;A.n++;A.dk+=+l.dk||0;if(!q)return;A.q+=q;A.D+=D;A.Y+=Y;A.B+=B;
  var a=A.d[l.ds]=A.d[l.ds]||{D:0,Y:0,B:0,q:0};a.D+=D;a.Y+=Y;a.B+=B;a.q+=q;
  if(l.kn){var kk=l.ds+'|'+l.kn,b=A.k[kk]=A.k[kk]||{ds:l.ds,kn:l.kn,D:0,Y:0,B:0,q:0};b.D+=D;b.Y+=Y;b.B+=B;b.q+=q}});return A}
/* Bir görevin son durumu (kayıtlardan) */
function bbTaskLog(logs,tid){var r=null;logs.forEach(function(l){if(!l.x&&l.t===tid&&(!r||(l.at||0)>=(r.at||0)))r=l});return r}
function bbEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function bbFmt(n){return n==null||isNaN(n)?'—':(Math.round(n*100)/100).toLocaleString('tr-TR',{maximumFractionDigits:2})}
/* ---------- grafikler (satır içi SVG) ---------- */
function bbBars(items,o){o=o||{};if(!items.length)return '';var W=640,H=o.h||170,L=30,R=8,T=12,B=26,mx=Math.max.apply(0,items.map(function(i){return i.v||0}).concat([o.min||5]));mx=Math.ceil(mx/5)*5||5;
  var bw=(W-L-R)/items.length,g='';for(var k=0;k<=4;k++){var v=Math.round(mx*k/4),y=T+(H-T-B)*(1-k/4);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" class="bbgl"/><text x="'+(L-5)+'" y="'+(y+4)+'" text-anchor="end" class="bbtx">'+v+'</text>'}
  items.forEach(function(it,i){var h=(H-T-B)*(it.v||0)/mx,x=L+i*bw+bw*.18,w=bw*.64;if(it.parts){var yy=H-B;it.parts.forEach(function(p){var hh=(H-T-B)*p.v/mx;if(hh>0){yy-=hh;g+='<rect x="'+x.toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+hh.toFixed(1)+'" rx="3" fill="'+p.c+'"><title>'+bbEsc(p.t)+': '+p.v+'</title></rect>'}})}
    else g+='<rect x="'+x.toFixed(1)+'" y="'+(H-B-h).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(0,h).toFixed(1)+'" rx="4" fill="'+(it.c||'#C9A227')+'"/>';
    if(it.v&&o.vals!==false)g+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-B-h-4).toFixed(1)+'" text-anchor="middle" class="bbtx b">'+it.v+'</text>';
    g+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" class="bbtx'+(it.on?' b':'')+'">'+bbEsc(it.l)+'</text>'});
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" class="bbsvg" role="img" aria-label="'+bbEsc(o.lab||'Grafik')+'">'+g+'</svg>'}
function bbLine(pts,o){o=o||{};pts=pts.filter(function(p){return p.v!=null});if(pts.length<2)return '';var W=640,H=o.h||190,L=34,R=14,T=14,B=30;
  var vs=pts.map(function(p){return p.v});if(o.goal!=null)vs.push(o.goal);var mx=Math.max.apply(0,vs),mn=Math.min.apply(0,vs);mx=Math.ceil((mx+2)/5)*5;mn=Math.max(0,Math.floor((mn-2)/5)*5);
  var X=function(i){return L+i*(W-L-R)/(pts.length-1)},Y=function(v){return T+(mx-v)*(H-T-B)/((mx-mn)||1)},g='',st=Math.max(5,Math.round((mx-mn)/4/5)*5);

function knOpts(ds,c){return '<option value="">— Konu seç —</option>'+bbDers(ds).konu.map(function(k){return '<option'+(k===c?' selected':'')+'>'+esc(k)+'</option>'}).join('')+'<option'+(c==='Karma / Genel tekrar'?' selected':'')+'>Karma / Genel tekrar</option>'}
function logSheet(l,t,w){var free=!t,ds=t?t.ds:(l.ds||'mat'),kn=t?t.kn:(l.kn||'');
  var o=sheet('<h3>'+(t?bbTp(t.tp)[2]+' '+esc(bbDers(t.ds).n)+(t.kn?' · '+esc(t.kn):''):'✏️ Çalışma ekle')+'</h3>'+(t&&t.q?'<div class="mut">Hedef: '+t.q+' soru'+(t.src?' · '+esc(t.src):'')+'</div>':'')+
   '<label>Nasıl geçti?</label><div class="chips" id="sC">'+[['y','✓ Yaptım'],['e','½ Yarım kaldı'],['n','✗ Yapamadım']].map(function(x){return '<button type="button" class="chip'+((l.s||'y')===x[0]?' on':'')+'" data-s="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>'+
   (free?'<div class="g2"><div><label>Ders</label><select id="fds">'+dsOpts(ds)+'</select></div><div><label>Tarih</label><input id="fd" type="date" max="'+today()+'" value="'+(l.d||today())+'"></div></div><label>Konu</label><select id="fkn">'+knOpts(ds,kn)+'</select>':'')+
   '<label>Çözdüğün sorular</label><div class="g3"><div><small class="mut">Doğru</small>'+stp('fD',l.D)+'</div><div><small class="mut">Yanlış</small>'+stp('fY',l.Y)+'</div><div><small class="mut">Boş</small>'+stp('fB',l.B)+'</div></div><div class="sum" id="fsum"></div>'+
   '<div class="g2"><div><label>Süre (dk)</label><input id="fdk" type="number" inputmode="numeric" min="0" max="600" value="'+(l.dk||'')+'" placeholder="ör. 40"></div><div><label>Not (isteğe bağlı)</label><input id="fnt" maxlength="160" value="'+esc(l.nt||'')+'"></div></div>'+
   '<div class="acts">'+(l.id&&free?'<button class="btn g" id="fdel" type="button">Sil</button>':'')+'<button class="btn g" id="fx" type="button">Vazgeç</button><button class="btn" id="fok" type="button">Kaydet</button></div>');
  var $=function(i){return o.querySelector('#'+i)},S=l.s||'y',calc=function(){var D=$('fD').value,Y=$('fY').value,B=$('fB').value,q=(+D||0)+(+Y||0)+(+B||0);$('fsum').innerHTML=q?q+' soru · net <b>'+bbFmt(bbNet(D,Y))+'</b> · başarı <b>%'+bbPct(D,Y,B)+'</b>':'<span class="mut">Soru çözmediysen boş bırakabilirsin.</span>'};calc();
  o.addEventListener('input',calc);o.addEventListener('click',function(e){var b=e.target.closest('[data-st]');if(b){var i=$(b.dataset.for);i.value=Math.max(0,(+i.value||0)+(+b.dataset.st));calc();return}var c=e.target.closest('[data-s]');if(c){S=c.dataset.s;o.querySelectorAll('#sC .chip').forEach(function(x){x.classList.toggle('on',x===c)})}});
  if(free)$('fds').onchange=function(){$('fkn').innerHTML=knOpts($('fds').value,'')};
  $('fx').onclick=function(){o.remove()};if($('fdel'))$('fdel').onclick=function(){addE(Object.assign({},l,{x:1}));o.remove();draw();toast('Kayıt silindi')};
  $('fok').onclick=function(){var e={id:l.id||uid(),s:S,D:N($('fD').value),Y:N($('fY').value),B:N($('fB').value),dk:N($('fdk').value,600),nt:($('fnt').value||'').trim().slice(0,160)};
    if(t)Object.assign(e,{t:t.id,w:w,d:bbAdd(w,t.g),ds:t.ds,kn:t.kn||'',tp:t.tp});else{Object.assign(e,{ds:$('fds').value,kn:$('fkn').value,d:$('fd').value||today(),tp:'soru'});if(e.d>today())e.d=today()}
    if(e.s==='y'&&t&&t.q&&!(e.D+e.Y+e.B)&&(t.tp==='soru'||t.tp==='deneme')){if(!o._w){o._w=1;toast('Doğru-yanlış sayılarını girersen başarı grafiğin oluşur. Yine de kaydetmek için tekrar dokun.');return}}
    addE(e);o.remove();draw();toast(e.s==='y'?'Harika, kaydedildi! 💪':'Kaydedildi')}}
function dnSheet(x){x=x||{r:{}};var o=sheet('<h3>'+(x.id?'Denemeyi düzenle':'＋ Deneme sonucu')+'</h3><div class="g2"><div><label>Deneme adı</label><input id="dn" maxlength="60" value="'+esc(x.n||'')+'" placeholder="ör. Türkiye geneli 3"></div><div><label>Tarih</label><input id="dd" type="date" max="'+today()+'" value="'+(x.d||today())+'"></div></div>'+
  '<div class="dg"><span></span><b>Doğru</b><b>Yanlış</b><b>Net</b>'+BBD.d.map(function(d){var r=(x.r||{})[d.k]||['',''];return '<div class="l" style="--dc:'+d.col+'">'+esc(d.n)+' <small>'+d.q+'</small></div><input type="number" inputmode="numeric" min="0" max="'+d.q+'" id="D_'+d.k+'" value="'+(r[0]!==''&&r[0]!=null?r[0]:'')+'"><input type="number" inputmode="numeric" min="0" max="'+d.q+'" id="Y_'+d.k+'" value="'+(r[1]!==''&&r[1]!=null?r[1]:'')+'"><output id="N_'+d.k+'">—</output>'}).join('')+'</div><div class="sum" id="dsum"></div>'+
  '<label>Yanlış yaptığın konular (isteğe bağlı)</label><input id="dwr" maxlength="200" value="'+esc(x.wr||'')+'" placeholder="ör. Basınç, üslü ifadeler">'+
  '<div class="acts">'+(x.id&&x.by!=='t'?'<button class="btn g" id="ddel" type="button">Sil</button>':'')+'<button class="btn g" id="dx" type="button">Vazgeç</button><button class="btn" id="dok" type="button">Kaydet</button></div>');
  var $=function(i){return o.querySelector('#'+i)},read=function(){var r={},err='';BBD.d.forEach(function(d){var a=$('D_'+d.k).value,b=$('Y_'+d.k).value;if(a===''&&b==='')return;var D=N(a,d.q)||0,Y=N(b,d.q)||0;if(D+Y>d.q)err=d.n+': doğru + yanlış en çok '+d.q;r[d.k]=[D,Y]});return {r:r,err:err}},
   calc=function(){var q=read(),y={r:q.r};BBD.d.forEach(function(d){$('N_'+d.k).textContent=bbFmt(bbDnNet(y,d.k))});$('dsum').innerHTML=q.err?'<span class="lo">⚠ '+esc(q.err)+'</span>':'Toplam net <b>'+bbFmt(bbDnTot(y))+'</b> · tahmini puan <b>'+bbFmt(bbPuan(y))+'</b>'};calc();
  o.addEventListener('input',calc);$('dx').onclick=function(){o.remove()};if($('ddel'))$('ddel').onclick=function(){addD(Object.assign({},x,{x:1}));o.remove();draw();toast('Deneme silindi')};
  $('dok').onclick=function(){var q=read();if(q.err){toast(q.err);return}if(!Object.keys(q.r).length){toast('En az bir dersin sonucunu gir');return}var d=$('dd').value||today();if(d>today())d=today();addD({id:x.id||uid(),n:($('dn').value||'').trim().slice(0,60)||'Deneme',d:d,r:q.r,wr:($('dwr').value||'').trim().slice(0,200)});o.remove();TAB='dn';draw();toast('Deneme kaydedildi 🎯')}}
/* ---------- olaylar ---------- */
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;
  if(a==='tab'){TAB=b.dataset.v;draw();scrollTo(0,0)}else if(a==='wk'){WK=b.dataset.v;draw()}
  else if(a==='re'){toast('Yenileniyor…');refresh();push()}else if(a==='out'){if(b.dataset.sure!=='1'){b.dataset.sure='1';toast('Çıkmak için tekrar dokun');setTimeout(function(){b.dataset.sure=''},3000);return}if(PEND.e.length+PEND.dn.length)push();logout()}
  else if(a==='free')logSheet({},null,null);
  else if(a==='tk'){var w=b.dataset.w,t=tasks(w).find(function(x){return x.id===b.dataset.id});if(!t)return;var l=bbTaskLog(logs(),t.id);logSheet(l?Object.assign({},l):{},t,w)}
  else if(a==='dnNew')dnSheet();else if(a==='dnEd'){var x=dns().find(function(z){return z.id===b.dataset.id});if(x)dnSheet(JSON.parse(JSON.stringify(x)))}});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&SES){refresh();push()}});
window.addEventListener('online',function(){push()});
setInterval(function(){if(SES&&document.visibilityState==='visible')refresh()},60000);
/* ---------- başlat ---------- */
if(SES){loadP();try{var c=JSON.parse(localStorage.getItem('bb-cache-'+SES.id)||'null');if(c){DOC=c.d;DAT=c.at;ack();draw()}}catch(e){}if(!DOC)app.innerHTML='<div class="wrap">'+head()+'<div class="card empty">Yükleniyor…</div></div>';refresh()}else login();
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(function(){})});
})();
</script>
